
services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3003:3003
    environment:
      NODE_ENV: production
      PORT: 3003
      BROWSER_WS_ENDPOINT: ws://browser:3000
      BROWSER_TOKEN: ${BROWSER_TOKEN:-local-token}
    depends_on:
      - browser
    restart: unless-stopped

  browser:
    image: ghcr.io/browserless/chromium:latest
    environment:
      TOKEN: ${BROWSER_TOKEN:-local-token}
      CONCURRENT: 2
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
        reservations:
          memory: 512M
    shm_size: 1G
    restart: unless-stopped
