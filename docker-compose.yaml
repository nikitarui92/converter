
services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3003:3003
    environment:
      NODE_ENV: production
      PORT: 3003
      BROWSER_WS_ENDPOINT: ws://browser:3000
      BROWSER_TOKEN: ${BROWSER_TOKEN:-local-token}
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped

  browser:
    image: ghcr.io/browserless/chromium:latest
    environment:
      TOKEN: ${BROWSER_TOKEN:-local-token}
      CONCURRENT: 2
      TIMEOUT: 60000
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://localhost:3000/active?token=$$TOKEN\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
